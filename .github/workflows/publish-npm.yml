name: Build and publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish already-versioned packages after building them
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Native package (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            package: darwin-x64
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            package: linux-x64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            package: linux-arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust target
        run: rustup target add '${{ matrix.target }}'
      - name: Install the Linux static-linker toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build native binary
        run: cargo build --locked --release --target '${{ matrix.target }}' --package quarters
      - name: Test the shipped target
        run: cargo test --locked --workspace --all-targets --target '${{ matrix.target }}'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Assemble native package
        env:
          NATIVE_PACKAGE: packaging/npm/platforms/${{ matrix.package }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          install -m 0755 "target/${NATIVE_TARGET}/release/quarters" "${NATIVE_PACKAGE}/bin/quarters"
          cp packaging/npm/platforms/README.md "${NATIVE_PACKAGE}/README.md"
          cp LICENSE NOTICE "${NATIVE_PACKAGE}/"
          mkdir npm-dist
          npm pack "${NATIVE_PACKAGE}" --pack-destination npm-dist
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: npm-${{ matrix.package }}
          path: npm-dist/*.tgz

  launcher:
    name: Typed launcher package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install locked development dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: packaging/npm/quarters-cli
      - name: Check launcher
        run: bun run check
        working-directory: packaging/npm/quarters-cli
      - name: Pack launcher
        run: |
          mkdir -p npm-stage/dist/src npm-dist
          cp packaging/npm/quarters-cli/package.json packaging/npm/quarters-cli/README.md npm-stage/
          cp packaging/npm/quarters-cli/dist/src/*.js npm-stage/dist/src/
          cp LICENSE NOTICE npm-stage/
          npm pack --ignore-scripts ./npm-stage --pack-destination npm-dist
      - name: Upload launcher package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: npm-launcher
          path: npm-dist/*.tgz

  install-smoke:
    name: Installed npm smoke (${{ matrix.package }})
    needs:
      - launcher
      - native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package: darwin-arm64
          - runner: macos-15-intel
            package: darwin-x64
          - runner: ubuntu-24.04
            package: linux-x64
          - runner: ubuntu-24.04-arm
            package: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download native package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-${{ matrix.package }}
          path: npm-smoke
      - name: Download launcher package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-launcher
          path: npm-smoke
      - name: Install and exercise packaged command
        env:
          NATIVE_PACKAGE: ${{ matrix.package }}
        run: |
          prefix="$RUNNER_TEMP/quarters-npm-prefix"
          store="$RUNNER_TEMP/quarters-npm-store"
          npm install --global --prefix "$prefix" \
            npm-smoke/quarters-cli-${NATIVE_PACKAGE}-*.tgz \
            npm-smoke/quarters-cli-[0-9]*.tgz
          export PATH="$prefix/bin:$PATH"
          quarters --version
          QUARTERS_ROOT="$store" quarters create smoke
          QUARTERS_ROOT="$store" quarters exec smoke -- /bin/sh -c 'test "$QUARTERS_SPACE" = smoke'

  publish:
    name: Publish to npm
    if: inputs.publish
    needs:
      - install-smoke
      - launcher
      - native
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/quarters-cli
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: npm-dist
      - name: Validate every publication without changing the registry
        run: |
          for archive in npm-dist/*.tgz; do
            npm publish "$archive" --access public --dry-run --tag alpha
          done
      - name: Publish native packages
        run: |
          npm publish npm-dist/quarters-cli-darwin-arm64-*.tgz --access public --tag alpha --provenance
          npm publish npm-dist/quarters-cli-darwin-x64-*.tgz --access public --tag alpha --provenance
          npm publish npm-dist/quarters-cli-linux-arm64-*.tgz --access public --tag alpha --provenance
          npm publish npm-dist/quarters-cli-linux-x64-*.tgz --access public --tag alpha --provenance
      - name: Publish launcher package
        run: npm publish npm-dist/quarters-cli-[0-9]*.tgz --access public --tag alpha --provenance
