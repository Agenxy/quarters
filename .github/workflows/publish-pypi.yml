name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish already-versioned distributions after building them
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust target
        run: rustup target add '${{ matrix.target }}'
      - name: Test the shipped target
        run: cargo test --locked --workspace --all-targets --target '${{ matrix.target }}'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --compatibility pypi --out dist
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.16.0
          rust-toolchain: "1.99.1"
          target: ${{ matrix.target }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Install and exercise wheel
        run: |
          uv venv --python python3 "$RUNNER_TEMP/quarters-pypi-venv"
          uv pip install --python "$RUNNER_TEMP/quarters-pypi-venv/bin/python" --no-deps dist/*.whl
          export PATH="$RUNNER_TEMP/quarters-pypi-venv/bin:$PATH"
          quarters --version
          QUARTERS_ROOT="$RUNNER_TEMP/quarters-pypi-store" quarters create smoke
          QUARTERS_ROOT="$RUNNER_TEMP/quarters-pypi-store" quarters exec smoke -- /bin/sh -c 'test "$QUARTERS_SPACE" = smoke'
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  source:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --out dist
          command: sdist
          maturin-version: v1.16.0
          rust-toolchain: "1.99.1"
      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: source-distribution
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: inputs.publish
    needs:
      - source
      - wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/quarters
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
