name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish already-versioned distributions after building them
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust target
        run: rustup target add '${{ matrix.target }}'
      - name: Test the shipped target
        run: cargo test --locked --workspace --all-targets --target '${{ matrix.target }}'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --locked --compatibility pypi --out dist
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.15.0
          rust-toolchain: "1.97.1"
          target: ${{ matrix.target }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Install and exercise wheel
        run: |
          uv venv --python python3 "$RUNNER_TEMP/quarters-pypi-venv"
          uv pip install --python "$RUNNER_TEMP/quarters-pypi-venv/bin/python" --no-deps dist/*.whl
          export PATH="$RUNNER_TEMP/quarters-pypi-venv/bin:$PATH"
          quarters --version
          QUARTERS_ROOT="$RUNNER_TEMP/quarters-pypi-store" quarters create smoke
          QUARTERS_ROOT="$RUNNER_TEMP/quarters-pypi-store" quarters exec smoke -- /bin/sh -c 'test "$QUARTERS_SPACE" = smoke'
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  source:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --out dist
          command: sdist
          maturin-version: v1.15.0
          rust-toolchain: "1.97.1"
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: source-distribution
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: inputs.publish
    needs:
      - source
      - wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/quarters
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
