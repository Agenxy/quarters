# Automated dependency updates (Agenxy ENGINEERING.md, Enforcement). The
# scheduled Drift workflow also covers pins Dependabot cannot update: the Rust
# toolchain, Bun, Node.js, maturin, uv, npm and cargo-audit.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /packaging/npm/quarters-cli
    schedule:
      interval: weekly
    groups:
      launcher:
        patterns: ["*"]
