<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Quarters">
  <title>Quarters</title>
  <!-- One account, divided: the outer rectangle is the host account and it is
       never broken, because Quarters does not create a second user. The divider
       splits what the shell sees. Both sides carry a bar at the same height and
       the same length, because the two homes are peers — same UID, same
       permissions, different state.

       The right bar is coloured, not the pane behind it. Filling a whole half
       read as "this side is locked" or "this side is selected", neither of
       which is the claim. A single bar says: the same kind of thing lives here,
       and it is yours.

       Tile, stroke weight and accent rule follow docs/icon.svg in Agenxy/dibs.
       Accent is the pigment-1 token at oklch(70% 0.145 32) for a dark surface. -->
  <rect width="32" height="32" rx="7.5" fill="#131518"/>
  <g fill="none" stroke="#dcdee2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.8" y="8.6" width="18.4" height="14.8" rx="2.6"/>
    <path d="M16 8.6 V23.4"/>
    <path d="M10.4 16 h3.1"/>
  </g>
  <path d="M18.5 16 h3.1" fill="none" stroke="#ea7963" stroke-width="2.6" stroke-linecap="round"/>
</svg>
