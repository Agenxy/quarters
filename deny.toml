[graph]
all-features = true
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# Quarters' own crates are GPL-3.0-or-later; dependencies stay on the list above.
exceptions = [
    { crate = "quarters", allow = ["GPL-3.0-or-later"] },
    { crate = "quarters-core", allow = ["GPL-3.0-or-later"] },
    { crate = "quarters-mcp", allow = ["GPL-3.0-or-later"] },
    { crate = "quarters-quality", allow = ["GPL-3.0-or-later"] },
]

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
