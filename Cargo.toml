[workspace]
members = [
    "crates/quarters-cli",
    "crates/quarters-core",
    "crates/quarters-mcp",
    "crates/quarters-quality",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/Agenxy/quarters"
homepage = "https://github.com/Agenxy/quarters"

[workspace.dependencies]
blake3 = "=1.8.7"
clap = "=4.6.7"
futures = "=0.3.34"
fs4 = "=1.1.0"
getrandom = "=0.4.3"
landlock = "=0.4.7"
jsonschema = { version = "=0.60.2", default-features = false }
nix = "=0.31.3"
proc-macro2 = "=1.0.107"
proc_pidinfo = "=0.1.4"
rmcp = { version = "=3.8.0", default-features = false, features = ["macros", "schemars", "server"] }
schemars = "=1.2.3"
serde = "=1.0.229"
serde_json = "=1.0.154"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = "=3.27.0"
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std"] }
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["codec", "rt"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
rust_2024_compatibility = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
