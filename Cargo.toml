[workspace]
members = [
    "crates/quarters-cli",
    "crates/quarters-core",
    "crates/quarters-quality",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Agenxy/quarters"
homepage = "https://github.com/Agenxy/quarters"

[workspace.dependencies]
clap = "=4.6.6"
fs4 = "=1.1.0"
nix = "=0.31.3"
proc-macro2 = "=1.0.107"
serde = "=1.0.229"
serde_json = "=1.0.151"
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = "=3.27.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
rust_2024_compatibility = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
